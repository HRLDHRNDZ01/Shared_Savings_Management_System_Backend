databases:
  - name: ssms-db
    plan: free
    databaseName: ssms
    user: ssms

services:
  - type: web
    name: ssms-api
    runtime: php
    plan: free
    region: singapore
    buildCommand: chmod +x bin/render-build.sh bin/render-start.sh && ./bin/render-build.sh
    startCommand: ./bin/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: SSMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: BROADCAST_CONNECTION
        value: log
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ssms-db
          property: connectionString
